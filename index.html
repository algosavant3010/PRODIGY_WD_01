<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    margin:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
}

th{
    background:#0066ff;
    color:white;
}

button{
    background:#0066ff;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

input{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:15px;
}

.success{
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Customer Dashboard</h1>

<p>Welcome back, John Anderson.</p>

</div>

<div class="card">

<h2>Order History</h2>

<table>

<tr>

<th>Order</th>

<th>Date</th>

<th>Status</th>

<th>Total</th>

</tr>

<tr>

<td>#1001</td>

<td>28 July 2026</td>

<td>Delivered</td>

<td>$420</td>

</tr>

<tr>

<td>#1002</td>

<td>29 July 2026</td>

<td>Shipped</td>

<td>$199</td>

</tr>

</table>

</div>

<div class="card">

<h2>Invoice PDF Download</h2>

<p>Download your latest invoice.</p>

<button>Download Invoice PDF</button>

</div>

<div class="card">

<h2>Profile Update</h2>

<form>

<label>Name</label>

<input
type="text"
value="John Anderson">

<label>Email</label>

<input
type="email"
value="john@example.com">

<label>Phone</label>

<input
type="text"
value="+1 202 555 0189">

<button type="submit">

Update Profile

</button>

</form>

<p class="success">

Profile updated successfully.

</p>

</div>

</div>

</body>

</html>
